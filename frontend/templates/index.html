<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Task Orchestrator</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header data-orchestrator="{{ orchestrator_agent_name }}"
          data-agent-windows="{{ hosted_agent_name_windows }}"
          data-agent-linux="{{ hosted_agent_name_linux }}"
          data-agent-pricing="{{ hosted_agent_name_pricing }}">
    <h1>Task Orchestrator</h1>
    <span class="user">{{ user }}</span>
    <span class="agent" id="active-agent-display">{{ orchestrator_agent_name }}</span>
    <span class="active-agent" id="handoff-banner" hidden>
      <span class="active-agent-label">→ routing to</span>
      <span id="handoff-target"></span>
    </span>
    <span class="active-agent" id="handback-banner" hidden>
      <span class="active-agent-label">↩ returning to</span>
      <span id="handback-target"></span>
    </span>
    <span class="tokens" id="token-counter" title="Total tokens used this session (input + output). A trailing ~ means the count is a client-side estimate (Foundry didn't report usage).">
      tokens: <span id="token-total">0</span>
      <span class="token-detail">(in <span id="token-in">0</span> / out <span id="token-out">0</span>)</span>
    </span>
    <button type="button" id="start-over" class="start-over" title="Clear all conversation history and start a fresh session.">Start over</button>
  </header>

  <main>
    <section id="chat-pane">
      <div id="messages" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input type="text" id="message" name="message"
               placeholder="Tell me what kind of VM you want to deploy (Windows or Linux)..."
               autofocus required />
        <button type="submit" id="send">Send</button>
      </form>
    </section>

    <aside id="tools-pane">
      <h2>Tool calls</h2>
      <ol id="tools-list"></ol>
    </aside>

    <aside id="log-pane">
      <h2>Terraform log</h2>
      <pre id="tf-log"></pre>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js" crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
  <footer>
    <span class="frontend-version">frontend v{{ frontend_version }}</span>
  </footer>
</body>
</html>
