<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Task Orchestrator</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    // Apply persisted theme before paint to avoid flash.
    (function () {
      try {
        var t = localStorage.getItem("vmagent-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <header data-orchestrator="{{ orchestrator_agent_name }}"
          data-agent-windows="{{ hosted_agent_name_windows }}"
          data-agent-linux="{{ hosted_agent_name_linux }}"
          data-agent-pricing="{{ hosted_agent_name_pricing }}">
    <h1>Task Orchestrator</h1>
    <span class="user">{{ user }}</span>
    <span class="agent" id="active-agent-display">{{ orchestrator_agent_name }}</span>
    <span class="tokens" id="token-counter" title="Total tokens used this session (input + output). A trailing ~ means the count is a client-side estimate.">
      tokens: <span id="token-total">0</span>
      <span class="token-detail">(in <span id="token-in">0</span> / out <span id="token-out">0</span>)</span>
    </span>
    <button type="button" id="theme-toggle" class="header-btn theme-toggle" title="Toggle light / dark theme" aria-label="Toggle theme">🌙</button>
    <button type="button" id="start-over" class="header-btn start-over" title="Clear all conversation history and start a fresh session.">Start over</button>
  </header>

  <main>
    <section id="chat-pane">
      <div id="messages" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input type="text" id="message" name="message"
               placeholder="Tell me what kind of VM you want to deploy (Windows or Linux)..."
               autofocus required />
        <button type="submit" id="send">Send</button>
      </form>
    </section>

    <aside id="activity-pane">
      <h2>Agent activity</h2>
      <ol id="activity"></ol>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js" crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
  <footer>
    <span class="frontend-version">frontend v{{ frontend_version }}</span>
  </footer>
</body>
</html>
