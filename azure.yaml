name: task-orchestrator
metadata:
  template: task-orchestrator@0.3.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  frontend:
    project: ./frontend
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: .

hooks:
  preprovision:
    posix:
      shell: sh
      run: ./infra/hooks/preprovision.sh
      interactive: true
    windows:
      shell: pwsh
      run: ./infra/hooks/preprovision.ps1
      interactive: true
  postprovision:
    posix:
      shell: sh
      run: ./infra/hooks/postprovision.sh
      interactive: true
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      interactive: true
